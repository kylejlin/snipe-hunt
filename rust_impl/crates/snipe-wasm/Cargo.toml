[package]
name = "snipe-wasm"
version = "0.1.0"
edition = "2021"
description = "JSON/WASM browser bridge for Snipe Hunt"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snipe-ai = { path = "../snipe-ai" }
snipe-core = { path = "../snipe-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
