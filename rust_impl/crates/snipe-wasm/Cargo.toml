[package]
name = "snipe-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
agent-avocado = { path = "../agent-avocado" }
agent-cherry = { path = "../agent-cherry" }
agent-fajita = { path = "../agent-fajita" }
agent-garlic = { path = "../agent-garlic" }
agent-honey = { path = "../agent-honey" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snipe-core = { path = "../snipe-core" }
snipe-prng = { path = "../snipe-prng" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
