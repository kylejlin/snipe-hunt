[package]
name = "old-snipe-wasm"
version = "0.2.0"
edition = "2021"
description = "JSON/WASM browser bridge for Snipe Hunt"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
snipe-ai = { package = "old-snipe-ai", path = "../old-snipe-ai" }
snipe-banana = { package = "old-snipe-banana", path = "../old-snipe-banana" }
snipe-core = { package = "old-snipe-core", path = "../old-snipe-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
