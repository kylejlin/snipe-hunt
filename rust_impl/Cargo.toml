[workspace]
resolver = "2"
members = [
    "crates/snipe-core",
    "crates/snipe-ai",
    "crates/snipe-banana",
    "crates/snipe-wasm",
    "crates/deslopped-core",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kylejlin/snipe-hunt"
rust-version = "1.85"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.release.package.snipe-ai]
debug = 1
