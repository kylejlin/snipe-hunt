[package]
name = "snipe-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
agent-avocado = { path = "../agent-avocado" }
agent-blueberry = { path = "../agent-blueberry" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snipe-core = { path = "../snipe-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
